name: Deploy to Aliyun

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "packages/ai/**"
      - "packages/agent/**"
      - "packages/coding-agent/**"
      - "packages/mom/**"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: meta
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER_LC}/pi-mono-mom" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/mom/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-push
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Push docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/opt/mom/"

      - name: Pull image and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script_stop: true
          script: |
            set -euo pipefail

            if [ "$(id -u)" -eq 0 ]; then
              SUDO=""
            else
              SUDO="sudo"
            fi

            echo "::group::Check Docker"

            if ! command -v docker >/dev/null 2>&1; then
              echo "Docker not found. Installing Docker on Alibaba Cloud Linux..."

              if [ -f /etc/os-release ]; then
                . /etc/os-release
                echo "Detected OS: ${ID:-unknown} ${VERSION_ID:-unknown}"
              fi

              if command -v yum >/dev/null 2>&1; then
                $SUDO yum install -y yum-utils device-mapper-persistent-data lvm2 ca-certificates curl

                # Use Aliyun Docker CE mirror instead of get.docker.com
                $SUDO yum-config-manager --add-repo https://mirrors.aliyun.com/docker-ce/linux/centos/docker-ce.repo

                $SUDO yum makecache

                $SUDO yum install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

              elif command -v dnf >/dev/null 2>&1; then
                $SUDO dnf install -y dnf-plugins-core ca-certificates curl

                $SUDO dnf config-manager --add-repo https://mirrors.aliyun.com/docker-ce/linux/centos/docker-ce.repo

                $SUDO dnf makecache

                $SUDO dnf install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

              elif command -v apt-get >/dev/null 2>&1; then
                $SUDO apt-get update
                $SUDO apt-get install -y ca-certificates curl gnupg

                $SUDO install -m 0755 -d /etc/apt/keyrings
                curl -fsSL https://download.docker.com/linux/ubuntu/gpg | $SUDO gpg --dearmor -o /etc/apt/keyrings/docker.gpg
                $SUDO chmod a+r /etc/apt/keyrings/docker.gpg

                echo \
                  "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \
                  $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
                  $SUDO tee /etc/apt/sources.list.d/docker.list > /dev/null

                $SUDO apt-get update
                $SUDO apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

              else
                echo "Unsupported Linux distribution. Please install Docker manually."
                exit 1
              fi

              $SUDO systemctl enable docker
              $SUDO systemctl start docker
            else
              echo "Docker already installed."
            fi

            if ! $SUDO docker compose version >/dev/null 2>&1; then
              echo "Docker Compose plugin is still missing."
              exit 1
            fi

            $SUDO docker --version
            $SUDO docker compose version

            echo "::endgroup::"

            cd /opt/mom

            echo "::group::Pull image"
            $SUDO docker compose pull mom
            echo "::endgroup::"

            echo "::group::Up"
            $SUDO docker compose up -d
            sleep 4
            $SUDO docker compose ps
            echo "::endgroup::"

            echo "::group::Health check"
            if [ "$($SUDO docker inspect --format='{{.State.Running}}' mom 2>/dev/null)" != "true" ]; then
              echo "mom container not running, recent logs:"
              $SUDO docker logs --tail 100 mom 2>&1 || true
              exit 1
            fi
            echo "mom is running"
            echo "::endgroup::"

            echo "::group::Prune old images"
            $SUDO docker image prune -f --filter "until=168h" || true
            echo "::endgroup::"